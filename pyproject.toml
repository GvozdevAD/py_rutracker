[project]
name = "py-rutracker-client "
version = "0.2.0"
description = "Библиотека для работы с RuTracker API - поиск раздач и скачивание торрентов"
authors = [
    {name = "GvozdevAD", email = "alexander@gvozdev.net"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
keywords = ["rutracker", "torrent", "tracker", "api", "async", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "beautifulsoup4 (>=4.14.2,<5.0.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
]

[project.urls]
Homepage = "https://github.com/GvozdevAD/py_rutracker"
Documentation = "https://github.com/GvozdevAD/py_rutracker#readme"
Repository = "https://github.com/GvozdevAD/py_rutracker"
Issues = "https://github.com/GvozdevAD/py_rutracker/issues"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-asyncio = "^1.3.0"
isort = "^7.0.0"
black = "^25.11.0"

